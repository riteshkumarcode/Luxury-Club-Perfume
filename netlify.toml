# ==============================================================================
# Luxury Club — Netlify Configuration (netlify.toml)
# ==============================================================================

[build]
  publish = "dist"
  command = "composer install --no-interaction --prefer-dist --optimize-autoloader && php build.php"

# Performance and Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.razorpay.com; frame-src https://api.razorpay.com https://www.google.com;"

# Long-term Asset Caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static JSON API Caching
[[headers]]
  for = "/api/*.json"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# 404 Fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
